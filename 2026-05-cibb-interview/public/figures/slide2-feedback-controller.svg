<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220" viewBox="0 60 700 220">
  <defs>
    <marker id="fb-arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a2130"/>
    </marker>
    <marker id="fb-tbar" markerWidth="12" markerHeight="20" refX="3" refY="10" orient="auto">
      <rect x="2" y="0" width="3" height="20" fill="#7A2A3D"/>
    </marker>
  </defs>

  <!-- Setpoint / Demand on the far left -->
  <rect x="30" y="130" width="120" height="60" rx="8" ry="8" fill="#f6f8fc" stroke="#2A5FAC" stroke-width="1.8"/>
  <text x="90" y="158" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a2130">Demand</text>
  <text x="90" y="178" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#5a6478">glucose · activity</text>

  <!-- Excitatory driver (Glu source) -->
  <rect x="200" y="130" width="150" height="60" rx="8" ry="8" fill="#E8EFF9" stroke="#2A5FAC" stroke-width="2"/>
  <text x="275" y="158" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2A5FAC">Glu source</text>
  <text x="275" y="178" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#5a6478">α-cell · pyramidal</text>

  <!-- SST integrator -->
  <rect x="400" y="130" width="150" height="60" rx="8" ry="8" fill="#FBE8EA" stroke="#7A2A3D" stroke-width="2"/>
  <text x="475" y="158" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7A2A3D">SST integrator</text>
  <text x="475" y="178" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#5a6478">δ-cell · SST⁺ IN</text>

  <!-- Output -->
  <rect x="600" y="130" width="80" height="60" rx="8" ry="8" fill="#f6f8fc" stroke="#1a2130" stroke-width="1.8"/>
  <text x="640" y="158" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a2130">Output</text>
  <text x="640" y="178" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-style="italic" fill="#5a6478">secretion · spike</text>

  <!-- Forward arrows -->
  <line x1="150" y1="160" x2="195" y2="160" stroke="#1a2130" stroke-width="2.4" marker-end="url(#fb-arr)"/>
  <line x1="350" y1="160" x2="395" y2="160" stroke="#2A5FAC" stroke-width="2.8" marker-end="url(#fb-arr)"/>
  <text x="372" y="151" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A5FAC">Glu</text>
  <line x1="550" y1="160" x2="595" y2="160" stroke="#1a2130" stroke-width="2.4" marker-end="url(#fb-arr)"/>

  <!-- Inhibitory feedback (negative loop) -->
  <path d="M 475 190 C 475 250, 275 270, 275 195"
        fill="none" stroke="#7A2A3D" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#fb-tbar)"/>
  <text x="375" y="282" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7A2A3D">delayed negative feedback (SST / GABA)</text>
</svg>
