<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     baseProfile="full" version="1.1"
     width="1800" height="780" viewBox="0 0 1800 780">
<defs>
  <marker id="arrow-blue-v3" markerHeight="11" markerWidth="11"
          markerUnits="userSpaceOnUse" orient="auto" refX="9" refY="5.5">
    <path d="M0,0 L11,5.5 L0,11 Z" fill="#2A5FAC" />
  </marker>
  <marker id="arrow-blue-thick" markerHeight="14" markerWidth="14"
          markerUnits="userSpaceOnUse" orient="auto" refX="11" refY="7">
    <path d="M0,0 L14,7 L0,14 Z" fill="#2A5FAC" />
  </marker>
  <marker id="tbar-wine-v3" markerHeight="22" markerWidth="8"
          markerUnits="userSpaceOnUse" orient="auto" refX="4" refY="11">
    <rect x="0" y="1" width="4" height="20" fill="#7A2A3D" />
  </marker>
  <marker id="tbar-wine-thick" markerHeight="26" markerWidth="10"
          markerUnits="userSpaceOnUse" orient="auto" refX="5" refY="13">
    <rect x="0" y="1" width="5" height="24" fill="#7A2A3D" />
  </marker>
</defs>

<!-- Panel backgrounds -->
<rect x="40" y="60" width="840" height="700" rx="14" ry="14" fill="#f6f8fc" stroke="none"/>
<rect x="920" y="60" width="840" height="700" rx="14" ry="14" fill="#fbf6f7" stroke="none"/>

<!-- Panel titles -->
<g id="cortex-title">
  <text x="460" y="106" fill="#1a2130" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Cortical microcircuit</text>
  <text x="460" y="138" fill="#5a6478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-style="italic" text-anchor="middle" letter-spacing="1">synaptic · fast · point-to-point</text>
  <line x1="340" y1="156" x2="580" y2="156" stroke="#2A5FAC" stroke-width="2.2" opacity="0.55"/>
</g>
<g id="islet-title">
  <text x="1340" y="106" fill="#1a2130" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Pancreatic islet</text>
  <text x="1340" y="138" fill="#5a6478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-style="italic" text-anchor="middle" letter-spacing="1">paracrine · slow · diffusion-mediated</text>
  <line x1="1220" y1="156" x2="1460" y2="156" stroke="#7A2A3D" stroke-width="2.2" opacity="0.55"/>
</g>

<!-- ============================================================ -->
<!-- CORTEX PANEL — cleaner pyramidal neuron + SST+ interneuron   -->
<!-- ============================================================ -->

<!-- Pyramidal cell: triangular soma with apical dendrite + tuft -->
<g id="pyramidal">
  <!-- apical trunk (thick) -->
  <line x1="260" y1="470" x2="260" y2="280" stroke="#1a2130" stroke-width="6" stroke-linecap="round"/>
  <!-- apical tuft -->
  <line x1="260" y1="280" x2="220" y2="220" stroke="#1a2130" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="260" y1="280" x2="300" y2="220" stroke="#1a2130" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="260" y1="280" x2="244" y2="216" stroke="#1a2130" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="260" y1="280" x2="276" y2="216" stroke="#1a2130" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="220" y1="220" x2="200" y2="190" stroke="#1a2130" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="220" y1="220" x2="216" y2="186" stroke="#1a2130" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="300" y1="220" x2="304" y2="186" stroke="#1a2130" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="300" y1="220" x2="320" y2="190" stroke="#1a2130" stroke-width="2.2" stroke-linecap="round"/>

  <!-- oblique dendrites -->
  <line x1="260" y1="350" x2="220" y2="330" stroke="#1a2130" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="260" y1="350" x2="300" y2="330" stroke="#1a2130" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="260" y1="400" x2="222" y2="386" stroke="#1a2130" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="260" y1="400" x2="298" y2="386" stroke="#1a2130" stroke-width="2.2" stroke-linecap="round"/>

  <!-- triangular soma -->
  <polygon points="260,470 212,560 308,560" fill="#E8EFF9" stroke="#1a2130" stroke-width="3.2"/>
  <text x="260" y="546" fill="#1a2130" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">P</text>

  <!-- basal dendrites -->
  <line x1="216" y1="560" x2="184" y2="600" stroke="#1a2130" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="240" y1="560" x2="220" y2="612" stroke="#1a2130" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="260" y1="560" x2="260" y2="616" stroke="#1a2130" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="280" y1="560" x2="300" y2="612" stroke="#1a2130" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="304" y1="560" x2="336" y2="600" stroke="#1a2130" stroke-width="2.4" stroke-linecap="round"/>

  <!-- axon -->
  <line x1="260" y1="560" x2="260" y2="640" stroke="#1a2130" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="260" y1="640" x2="380" y2="640" stroke="#1a2130" stroke-width="2.2" stroke-linecap="round"/>
  <text x="260" y="678" fill="#5a6478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-style="italic" text-anchor="middle">pyramidal cell</text>
</g>

<!-- SST+ interneuron, with axonal cloud targeting the apical dendrite -->
<g id="sst-interneuron">
  <ellipse cx="640" cy="320" rx="58" ry="44" fill="#FBE8EA" stroke="#7A2A3D" stroke-width="3.2"/>
  <line x1="582" y1="310" x2="540" y2="294" stroke="#1a2130" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="582" y1="330" x2="540" y2="346" stroke="#1a2130" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="698" y1="330" x2="740" y2="346" stroke="#1a2130" stroke-width="2.0" stroke-linecap="round"/>
  <line x1="640" y1="276" x2="660" y2="240" stroke="#1a2130" stroke-width="2.0" stroke-linecap="round"/>
  <text x="640" y="316" fill="#1a2130" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">SST⁺</text>
  <text x="640" y="340" fill="#5a6478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-style="italic" text-anchor="middle">interneuron</text>
  <text x="640" y="402" fill="#5a6478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-style="italic" text-anchor="middle">(Martinotti / SOM)</text>
</g>

<!-- Glu arrow: from pyramidal apical dendrite up to SST+ -->
<g id="glu-arrow-cortex">
  <path d="M 304 264 C 400 232, 510 250, 588 296"
        fill="none" stroke="#2A5FAC" stroke-width="6" stroke-linecap="round"
        marker-end="url(#arrow-blue-thick)"/>
  <text x="446" y="232" fill="#2A5FAC" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Glu</text>
  <text x="446" y="254" fill="#5a6478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-style="italic" text-anchor="middle">AMPA + NMDA</text>
</g>

<!-- GABA arrow: SST+ back down to apical/oblique dendrite of pyramidal -->
<g id="gaba-arrow-cortex">
  <path d="M 590 354 C 510 410, 410 410, 322 374"
        fill="none" stroke="#7A2A3D" stroke-width="6" stroke-linecap="round"
        marker-end="url(#tbar-wine-thick)"/>
  <text x="456" y="468" fill="#7A2A3D" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">GABA</text>
  <text x="456" y="490" fill="#5a6478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-style="italic" text-anchor="middle">fast brake on apical dendrite</text>
</g>

<!-- Cortex timescale pill -->
<g id="ts-cortex">
  <rect x="320" y="700" width="280" height="44" rx="22" ry="22" fill="#2A5FAC"/>
  <text x="460" y="729" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="1.2">timescale ~ 1–10 ms</text>
</g>

<!-- ============================================================ -->
<!-- ISLET PANEL — α, β, δ with cleaner paracrine arrows           -->
<!-- ============================================================ -->

<!-- α-cell (upper-left of islet) -->
<g id="alpha-cell">
  <ellipse cx="1080" cy="320" rx="62" ry="50" fill="#dde2eb" stroke="#1a2130" stroke-width="3"/>
  <text x="1056" y="332" fill="#1a2130" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" font-style="italic" text-anchor="middle">α</text>
  <circle cx="1102" cy="324" r="4" fill="#2A5FAC"/>
  <circle cx="1092" cy="332" r="4" fill="#2A5FAC"/>
  <circle cx="1110" cy="310" r="4" fill="#2A5FAC"/>
  <circle cx="1094" cy="304" r="4" fill="#2A5FAC"/>
  <text x="1080" y="392" fill="#5a6478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-style="italic" text-anchor="middle">α-cell</text>
  <text x="1080" y="412" fill="#2A5FAC" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Glu + glucagon</text>
</g>

<!-- β-cell (lower) -->
<g id="beta-cell">
  <ellipse cx="1290" cy="540" rx="74" ry="60" fill="#dee3ea" stroke="#1a2130" stroke-width="3"/>
  <text x="1244" y="552" fill="#1a2130" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" font-style="italic" text-anchor="middle">β</text>
  <circle cx="1318" cy="540" r="3.8" fill="#c08a3b"/>
  <circle cx="1308" cy="552" r="3.8" fill="#c08a3b"/>
  <circle cx="1322" cy="556" r="3.8" fill="#c08a3b"/>
  <circle cx="1330" cy="528" r="3.8" fill="#c08a3b"/>
  <circle cx="1312" cy="524" r="3.8" fill="#c08a3b"/>
  <circle cx="1296" cy="538" r="3.8" fill="#c08a3b"/>
  <text x="1290" y="624" fill="#5a6478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-style="italic" text-anchor="middle">β-cell</text>
  <text x="1290" y="644" fill="#a06a20" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">insulin</text>
</g>

<!-- δ-cell (right) with filopodia -->
<g id="delta-cell">
  <path d="M 1530 360 C 1450 290, 1240 290, 1142 322"
        fill="none" stroke="#9aa3b0" stroke-width="2" stroke-linecap="round"/>
  <path d="M 1554 408 C 1500 510, 1390 580, 1340 552"
        fill="none" stroke="#9aa3b0" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="1570" cy="380" rx="56" ry="46" fill="#f1dde2" stroke="#7A2A3D" stroke-width="3"/>
  <text x="1542" y="392" fill="#7A2A3D" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" font-style="italic" text-anchor="middle">δ</text>
  <circle cx="1592" cy="384" r="4" fill="#7A2A3D"/>
  <circle cx="1582" cy="392" r="4" fill="#7A2A3D"/>
  <circle cx="1598" cy="370" r="4" fill="#7A2A3D"/>
  <text x="1570" y="448" fill="#5a6478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-style="italic" text-anchor="middle">δ-cell</text>
  <text x="1570" y="468" fill="#7A2A3D" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">somatostatin</text>
  <text x="1570" y="486" fill="#5a6478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle">(with filopodia)</text>
</g>

<!-- Glu paracrine arc α → δ -->
<g id="glu-arrow-islet">
  <circle cx="1180" cy="250" r="2.6" fill="#2A5FAC"/>
  <circle cx="1260" cy="240" r="2.6" fill="#2A5FAC"/>
  <circle cx="1340" cy="248" r="2.6" fill="#2A5FAC"/>
  <circle cx="1420" cy="266" r="2.6" fill="#2A5FAC"/>
  <path d="M 1138 290 C 1240 220, 1440 220, 1530 350"
        fill="none" stroke="#2A5FAC" stroke-width="5"
        stroke-dasharray="9,6" stroke-linecap="round"
        marker-end="url(#arrow-blue-thick)"/>
  <text x="1320" y="216" fill="#2A5FAC" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Glu / AMPA</text>
  <text x="1320" y="240" fill="#5a6478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-style="italic" text-anchor="middle">(GluR4c-flip, GRIA4)</text>
</g>

<!-- SST paracrine arc δ → α -->
<g id="sst-arrow-islet">
  <circle cx="1430" cy="460" r="2.6" fill="#7A2A3D"/>
  <circle cx="1340" cy="470" r="2.6" fill="#7A2A3D"/>
  <circle cx="1240" cy="466" r="2.6" fill="#7A2A3D"/>
  <circle cx="1160" cy="450" r="2.6" fill="#7A2A3D"/>
  <path d="M 1530 414 C 1430 510, 1230 510, 1136 358"
        fill="none" stroke="#7A2A3D" stroke-width="5"
        stroke-dasharray="9,6" stroke-linecap="round"
        marker-end="url(#tbar-wine-thick)"/>
  <text x="1320" y="528" fill="#7A2A3D" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">somatostatin / SSTR2</text>
  <text x="1320" y="552" fill="#5a6478" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-style="italic" text-anchor="middle">(GPCR, paracrine)</text>
</g>

<!-- Islet timescale pill -->
<g id="ts-islet">
  <rect x="1200" y="700" width="280" height="44" rx="22" ry="22" fill="#7A2A3D"/>
  <text x="1340" y="729" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="1.2">timescale ~ s – min</text>
</g>

<!-- center divider -->
<line x1="900" y1="80" x2="900" y2="740" stroke="#9aa3b0" stroke-width="1" opacity="0.4"/>
</svg>
